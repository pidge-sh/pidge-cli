name: test

# No secrets needed — the suite runs against the local mock server
# (test/mock-server.js); `ws` is a devDependency npm ci brings.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # timeout: a hung suite must fail in minutes with a process dump below,
      # never sit until the runner's 6-hour kill.
      - run: timeout -k 30 720 npm test
      - name: dump surviving processes on failure
        if: failure()
        run: ps -ef
