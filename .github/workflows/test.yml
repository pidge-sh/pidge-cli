name: test

# No secrets needed — the suite runs against the local mock server
# (test/mock-server.js); `ws` is a devDependency npm ci brings.
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here writes to the repo or the registry.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # No dependency cache: a poisoned cache entry is a supply-chain hole,
          # and this tree has exactly one devDependency to fetch.
          package-manager-cache: false
      # --ignore-scripts: no dependency here needs a lifecycle script to install,
      # so refuse to run any that a compromised release might add.
      - run: npm ci --ignore-scripts
      # One file at a time, each under its own timeout: the TAP stream buffers a
      # whole file's output, so a single hung test reads as global silence — this
      # names the file (and its last lines) instead.
      - run: |
          status=0
          for f in test/*.test.js; do
            echo "== $f"
            if timeout -k 10 240 node --test "$f" > /tmp/out.log 2>&1; then
              tail -3 /tmp/out.log
            else
              echo "FAILED OR HUNG: $f — failing tests:"
              grep -B3 -A30 'not ok' /tmp/out.log | head -220
              tail -8 /tmp/out.log
              status=1
            fi
          done
          exit $status
      - name: dump surviving processes on failure
        if: failure()
        run: ps -ef
