name: test

# No secrets needed — the suite runs against the local mock server
# (test/mock-server.js); `ws` is a devDependency npm ci brings.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One file at a time, each under its own timeout: the TAP stream buffers a
      # whole file's output, so a single hung test reads as global silence — this
      # names the file (and its last lines) instead.
      - run: |
          status=0
          for f in test/*.test.js; do
            echo "== $f"
            if timeout -k 10 240 node --test "$f" > /tmp/out.log 2>&1; then
              tail -3 /tmp/out.log
            else
              echo "FAILED OR HUNG: $f — last 60 lines:"
              tail -60 /tmp/out.log
              status=1
            fi
          done
          exit $status
      - name: dump surviving processes on failure
        if: failure()
        run: ps -ef
