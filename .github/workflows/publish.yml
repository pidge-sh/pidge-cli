name: publish

# Releases are cut by tag, never by a push to a branch: `git tag vX.Y.Z && git
# push --tags` is the only thing that can start this workflow.
#
# The chain is deliberately split in two halves that trust each other as little
# as possible:
#
#   build    — no secrets, no id-token, no environment. Installs, runs the full
#              suite, produces the tarball, uploads it as an artifact.
#   publish  — gated behind the `npm-publish` GitHub Environment (human approval),
#              holds the OIDC token, and publishes THAT tarball. It never runs
#              `npm pack` again, never runs repo code, and never installs
#              dependencies, so nothing between approval and upload can change
#              what ships.
#
# There is no npm token anywhere. Authentication is OIDC trusted publishing;
# provenance is generated automatically as a side effect of it.
on:
  push:
    tags: ['v*']

permissions: {}

env:
  # Pinned toolchain. Node 24.19.0 ships npm 11.17.0, which is above both
  # floors that matter here: 11.5.1 for OIDC trusted publishing and 11.15.0 for
  # staged publishing. Bumping this line is a deliberate act — check both floors
  # still hold before you do.
  NODE_VERSION: 24.19.0
  PACKAGE_NAME: pidge-cli

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: install
        run: npm ci --ignore-scripts

      - name: test
        run: npm test

      - name: pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          tarball=$(npm pack --ignore-scripts --pack-destination dist --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d));
            process.stdin.on("end", () => process.stdout.write(JSON.parse(s)[0].filename));
          ')
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed dist/$tarball"
          # Recorded so the published dist.shasum can be traced back to this run
          # (see SECURITY.md — the tarball is reproducible from the tag).
          shasum -a 1 "dist/$tarball"
          shasum -a 256 "dist/$tarball"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: dist/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewer lives on this Environment: the job waits here until a
    # human approves it in the GitHub UI.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout. This job's whole input is the artifact the build job made.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: dist

      - name: sanity checks
        id: checks
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tarball=$(ls dist/*.tgz)
          test -f "$tarball" || { echo "::error::no tarball in the artifact"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "publishing $tarball"
          shasum -a 1 "$tarball"

          # The manifest comes out of the tarball, not out of a checkout: what we
          # validate is exactly what we upload.
          manifest=$(tar -xzOf "$tarball" package/package.json)
          name=$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')
          version=$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')

          if [ "$name" != "$PACKAGE_NAME" ]; then
            echo "::error::tarball is $name, expected $PACKAGE_NAME"
            exit 1
          fi

          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package version $version (expected tag v$version)"
            exit 1
          fi

          # Already on the registry means this tag is a replay or the version bump
          # was forgotten. Either way, stop before touching the registry.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version already exists on the registry"
            exit 1
          fi

          echo "ok: $name@$version, tag $TAG, not yet on the registry"

      - name: publish
        env:
          TARBALL: ${{ steps.checks.outputs.tarball }}
        run: |
          set -euo pipefail
          npm --version

          # Staged publishing (npm >= 11.15.0) uploads the tarball to a staging
          # area and waits for a maintainer to approve it with 2FA on npmjs.com —
          # a second human gate after the Environment reviewer, on the registry
          # side. The pinned toolchain (npm 11.17.0) takes this path; the fallback
          # exists only so an unexpected toolchain downgrade degrades to a plain
          # publish instead of failing the release.
          #
          # --ignore-scripts is belt-and-braces: publishing a tarball spec (rather
          # than a directory) already skips lifecycle scripts.
          #
          # Provenance is not passed explicitly — npm enables it automatically when
          # it authenticates over OIDC from GitHub Actions with id-token: write.
          minimum=11.15.0
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -1)" = "$minimum" ]; then
            echo "npm $actual supports staged publishing — staging $TARBALL"
            npm stage publish "$TARBALL" --ignore-scripts
            echo "Staged. Approve it under Staged Packages on npmjs.com to make it live."
          else
            echo "npm $actual predates staged publishing — publishing $TARBALL directly"
            npm publish "$TARBALL" --ignore-scripts
          fi
